return `<section class="studio" style="--accent:${studio==='Balance'?'#a34470':'#087f80'}"><div class="heading"><h2>${studio}${mode==='coach'?' · '+esc(who):''}</h2><small>${short(w)} – ${short(shift(w,6))}</small></div><p class="week-story">${mode==='coach'?'Tus clases sumaron':'Esta semana hubo'} <b>${fmt.format(s.a)} asistencias</b> en <b>${s.n} clases</b>: <b>${dec.format(s.avg)} por clase</b>.</p><div class="kpis"><div class="kpi"><span>Asistencias</span><strong>${fmt.format(s.a)}</strong><em>${delta(s.a,p.n?p.a:null)}</em></div><div class="kpi"><span>Personas por clase</span><strong>${dec.format(s.avg)}</strong><em>${delta(s.avg,p.avg)}</em></div><div class="kpi"><span>Reservas</span><strong>${fmt.format(s.r)}</strong><em>${dec.format(s.r/s.n)} por clase</em></div><div class="kpi"><span>Clases</span><strong>${s.n}</strong><em>${s.rate===null?'Sin reservas':Math.round(s.rate*100)+'% de reservas asistieron'}</em></div></div><div class="insights"><span>${breakdown==='day'?'Día con mayor asistencia por clase':'Horario con mayor asistencia por clase'}: <b>${esc(best.label)} · ${dec.format(best.avg)}</b><small> (${best.n} clases)</small></span><span>Reservas sin asistencia: <b>${s.r-s.a}</b></span></div><div class="charts"><div><div class="charthead"><h3>Así van ${mode==='coach'?'tus clases':'las clases'}</h3><select class="metric" aria-label="Medida de la gráfica"><option value="average" ${metric==='average'?'selected':''}>Promedio por clase</option><option value="total" ${metric==='total'?'selected':''}>Total por semana</option></select></div><div class="legend">Últimas 8 semanas · <i class="dot"></i>Asistencias<i class="dot light"></i>Reservas</div>${columns(history,metric==='average')}</div><div><div class="charthead"><h3>Esta semana</h3><select class="breakdown" aria-label="Agrupar esta semana"><option value="day" ${breakdown==='day'?'selected':''}>Por día</option><option value="hour" ${breakdown==='hour'?'selected':''}>Por hora</option></select></div><div class="legend">Promedio por clase · <i class="dot"></i>Asistencias<i class="dot light"></i>Reservas</div>${bars(daily,true)}</div></div><details><summary>${mode==='study'?'Ver cada coach':'Ver mis clases, una por una'}</summary><div class="tablewrap"><table><thead><tr><th>${mode==='study'?'Coach':'Fecha · Hora · Clase'}</th><th>Clases</th><th>Asistencias</th><th>Promedio por clase</th><th>Reservas</th></tr></thead><tbody>${coachRows.map(c=>`<tr><td>${mode==='study'?`<button data-coach="${esc(c.key)}">${esc(c.key)}</button>`:esc(c.key)}</td><td>${c.n}</td><td>${c.a}</td><td>${dec.format(c.avg)}</td><td>${c.r}</td></tr>`).join('')}</tbody></table></div></details></section>`}).join('');document.querySelectorAll('.metric').forEach(el=>el.onchange=()=>{metric=el.value;render()});document.querySelectorAll('.breakdown').forEach(el=>el.onchange=()=>{breakdown=el.value;render()});document.querySelectorAll('[data-coach]').forEach(el=>el.onclick=()=>{mode='coach';$('coach').value=el.dataset.coach;render();window.scrollTo({top:0,behavior:'smooth'})})}
$('study').onclick=()=>{mode='study';render()};$('personal').onclick=()=>{mode='coach';render()};['week','coach','discipline'].forEach(id=>$(id).onchange=render);$('print').onclick=()=>window.print();render();
</script></body></html>
